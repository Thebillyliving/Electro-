    ['iPhone 15 Pro Max 256GB',2,'Apple',1950000,0,7,0,1,'Storage: 256GB\nChip: A17 Pro'],
    ['LG 55" 4K Smart UHD TV',3,'LG',520000,15,10,1,0,'Size: 55"\nResolution: 4K\nSmart: webOS'],
    ['Hisense 280L Double Door Fridge',4,'Hisense',410000,10,8,0,0,'Capacity: 280L\nType: Double door\nEnergy: A+'],
    ['LG 8kg Front Load Washing Machine',5,'LG',560000,7,5,0,0,'Capacity: 8kg\nType: Front load\nSpin: 1200rpm'],

    ['Midea 1.5HP Split Air Conditioner',7,'Midea',395000,10,12,1,0,'Capacity: 1.5HP\nType: Split\nGas: R410A'],
    ['Epson EcoTank L3250 Printer',8,'Epson',245000,0,15,0,0,'Type: Inkjet 3-in-1\nWiFi: Yes'],
    ['Bosch GSB 13 RE Impact Drill',9,'Bosch',68000,10,25,0,0,'Power: 600W\nChuck: 13mm'],
    ['Industrial Pepper Grinding Machine',10,'Local',185000,0,2,0,0,'Motor: 3HP\nMaterial: Stainless steel']
  ];
  const products=P.map((p,i)=>({id:'p'+i,name:p[0],cat:'c'+p[1],brand:p[2],price:p[3],discount:p[4],stock:p[5],flash:!!p[6],featured:!!p[7],specs:p[8],desc:'Brand new, genuine and covered by warranty. Nationwide delivery available.',warranty:'12 months',sku:'EL-'+(1000+i),image:'',active:true,created:day(14-i),sold:0}));
  const users=[
    {id:'u1',name:'Ada Obi',email:'ada@mail.com',phone:'08011111111',pass:'1234',created:day(12),blocked:false},
    {id:'u2',name:'Tunde Bello',email:'tunde@mail.com',phone:'08022222222',pass:'1234',created:day(9),blocked:false}];
  const mk=(n,u,items,ago,status,pay,state)=>{

    it.forEach(x=>{products.find(p=>p.id===x.id).sold+=x.qty});
    return {id:'ORD-'+(1000+n),userId:u.id,name:u.name,phone:u.phone,email:u.email,address:'12 Sample Street',state,city:state,items:it,subtotal:sub,shipping:ship,discount:0,coupon:'',vat:0,total:sub+ship,payment:pay,payStatus:status==='Delivered'||status==='Shipped'?'Paid':'Pending',status,date:day(ago)};
  };
  const orders=[mk(1,users[0],[[0,1]],6,'Delivered','card','Lagos'),mk(2,users[1],[[4,1],[11,1]],5,'Delivered','transfer','Abuja (FCT)'),mk(3,users[0],[[6,1]],3,'Shipped','card','Lagos'),mk(4,users[1],[[2,2]],2,'Processing','transfer','Lagos'),mk(5,users[0],[[10,1]],1,'Pending','transfer','Rivers'),mk(6,users[1],[[12,2],[3,1]],0,'Pending','card','Lagos')];
  return {
    products,categories:cats,orders,users,
    coupons:[{id:'k1',code:'WELCOME10',type:'percent',value:10,min:50000,expires:'2027-12-31',active:true,used:0}],
    banners:[
      {id:'b1',title:'Power Up Your Home',sub:'Generators, inverters & solar from trusted brands',icon:'🔌',color:'#ff6a00',cat:'c0',active:true},
      {id:'b2',title:'Latest Phones & Laptops',sub:'Genuine devices with warranty',icon:'💻',color:'#16a34a',cat:'c1',active:true},
      {id:'b3',title:'Home Appliances Sale',sub:'Up to 15% off fridges, ACs and TVs',icon:'🧊',color:'#141414',cat:'c4',active:true}],
    reviews:[
      {id:'r1',pid:'p0',name:'Ada Obi',rating:5,text:'Very quiet and fuel efficient. Delivered fast.',date:day(4),approved:true},

    settings:{name:'ELECTRO',tagline:'Electronics & Machines Marketplace',phone:'+234 800 000 0000',whatsapp:'2348000000000',email:'support@electro.ng',address:'Lagos, Nigeria',vat:7.5,lowStock:5,adminEmail:'admin@electro.ng',adminPass:'admin123',card:true,transfer:true,bank:'Bank: Your Bank\nAccount: 0000000000\nName: ELECTRO Ltd',autoApprove:true},
    cart:[],wish:[],session:{user:null,admin:false}

}
/* ===== CLOUD CONFIG: paste your keys here to switch from demo mode to Firebase + Paystack ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDe-2OdWJj2lMrOENFxaedGdigAmdtq0fc",authDomain:"electroap.firebaseapp.com",projectId:"electroap",storageBucket:"electroap.firebasestorage.app",messagingSenderId:"992912306377",appId:"1:992912306377:web:eb0c21b3d4e95515735d18"}; /* e.g. {apiKey:"...",authDomain:"...",projectId:"...",storageBucket:"...",messagingSenderId:"...",appId:"..."} */
const PAYSTACK_KEY='';      /* pk_test_xxx or pk_live_xxx (public key only) */
const CLOUD=!!FIREBASE_CONFIG;
function blank(){const d=seed();['products','categories','orders','users','coupons','banners','reviews','shipping'].forEach(k=>d[k]=[]);d.settings.adminEmail='';d.settings.adminPass='';try{Object.assign(d,JSON.parse(localStorage.getItem(KEY+'_local'))||{})}catch(e){}d.session={user:null,admin:false};return d}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.products)return d}catch(e){}return seed()}
let DB=CLOUD?blank():load();
function save(){
  try{if(CLOUD)localStorage.setItem(KEY+'_local',JSON.stringify({cart:DB.cart,wish:DB.wish}));else localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Storage full. Use smaller images.')}
  if(CLOUD)cloudPush();
}
/* ============ CLOUD LAYER (Firebase + Paystack) ============ */
const PUB=['products','categories','coupons','banners','shipping','reviews'],COLS=[...PUB,'orders','users'];
let fs=null,au=null,st=null,SNAP={};
const pubSettings=()=>{const x={...DB.settings};delete x.adminEmail;delete x.adminPass;return x};
const clean=x=>{const o=JSON.parse(JSON.stringify(x));delete o.pass;return o};
const authMsg=e=>({'auth/invalid-credential':'Wrong email or password','auth/user-not-found':'No account with that email','auth/wrong-password':'Wrong email or password','auth/email-already-in-use':'Email already registered','auth/weak-password':'Password must be at least 6 characters','auth/too-many-requests':'Too many attempts. Try later'}[e.code]||e.message);
function cloudErr(e){console.error(e);toast('Cloud: '+(e.code==='permission-denied'?'not allowed':e.message))}
function loadScript(u){return new Promise((r,j)=>{const x=document.createElement('script');x.src=u;x.onload=r;x.onerror=()=>j(new Error('Failed to load '+u));document.head.appendChild(x)})}
async function cloudInit(){
  const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
  await loadScript(b+'app-compat.js');
  await Promise.all(['auth','firestore'].map(m=>loadScript(b+m+'-compat.js')));
  firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();au=firebase.auth();
}
const docs=q=>q.docs.map(d=>({...d.data(),id:d.id}));
const snapOf=l=>Object.fromEntries(l.map(x=>[x.id,JSON.stringify(x)]));
async function pull(col){DB[col]=docs(await fs.collection(col).get());SNAP[col]=snapOf(DB[col])}
async function pullSettings(){const d=await fs.doc('settings/main').get();if(d.exists)Object.assign(DB.settings,d.data());SNAP.settings=JSON.stringify(pubSettings())}
async function pullOrders(){
  const sort=l=>l.sort((a,b)=>new Date(a.date||a.created)-new Date(b.date||b.created));
  if(DB.session.admin){DB.orders=sort(docs(await fs.collection('orders').get()));DB.users=sort(docs(await fs.collection('users').get()));SNAP.users=snapOf(DB.users)}
  else if(DB.session.user)DB.orders=sort(docs(await fs.collection('orders').where('userId','==',DB.session.user).get()));
  else DB.orders=[];
  SNAP.orders=snapOf(DB.orders);
}
function cloudPush(){
  if(!fs)return;
  COLS.forEach(c=>{
    SNAP[c]=SNAP[c]||{};const cur={};(DB[c]||[]).forEach(x=>cur[x.id]=x);
    for(const id in cur){const j=JSON.stringify(cur[id]);if(SNAP[c][id]!==j){SNAP[c][id]=j;fs.collection(c).doc(id).set(clean(cur[id])).catch(cloudErr)}}
    if(DB.session.admin)for(const id in SNAP[c])if(!cur[id]){delete SNAP[c][id];fs.collection(c).doc(id).delete().catch(cloudErr)}
  });
  const j=JSON.stringify(pubSettings());
  if(DB.session.admin&&SNAP.settings!==j){SNAP.settings=j;fs.doc('settings/main').set(pubSettings()).catch(cloudErr)}
}
async function onAuth(u){
  DB.session={user:null,admin:false};DB.orders=[];SNAP.orders={};
  if(!DB.session.admin)DB.users=[];SNAP.users={};
  if(u){
    let prof=null,adm=false;
    try{const d=await fs.doc('users/'+u.uid).get();if(d.exists)prof={...d.data(),id:u.uid}}catch(e){}
    try{adm=(await fs.doc('admins/'+u.uid).get()).exists}catch(e){}
    if(prof&&prof.blocked&&!adm){toast('Account blocked. Contact support.');await au.signOut();return}
    DB.session.admin=adm;DB.session.user=prof?u.uid:null;
    if(prof){DB.users=[prof];SNAP.users=snapOf(DB.users)}
    try{await pullOrders()}catch(e){cloudErr(e)}
  }
}
async function getStorage(){if(!st){await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js');st=firebase.storage()}return st}
async function uploadImage(dataUrl){const sg=await getStorage(),b=await (await fetch(dataUrl)).blob(),r=sg.ref('products/'+uid()+'.jpg');await r.put(b,{contentType:'image/jpeg'});return r.getDownloadURL()}
async function boot(){
  if(!CLOUD){route();return}
  try{
    await cloudInit();
    await Promise.all([...PUB.map(c=>pull(c).catch(()=>{DB[c]=[];SNAP[c]={}})),pullSettings().catch(()=>{})]);
    au.onAuthStateChanged(async u=>{await onAuth(u);route()});
  }catch(e){document.body.innerHTML='<div class="empty">Could not connect to Firebase: '+esc(e.message)+'</div>'}
}
async function payWithPaystack(o){
  try{if(!window.PaystackPop)await loadScript('https://js.paystack.co/v1/inline.js')}catch(e){return toast('Could not load Paystack')}
  PaystackPop.setup({key:PAYSTACK_KEY,email:o.email,amount:Math.round(o.total*100),currency:'NGN',ref:o.id+'-'+Date.now(),metadata:{orderId:o.id},
    callback:function(r){if(!CLOUD){o.payStatus='Paid';save()}toast('Payment received. Thank you!');detailsForm(o.id);if(CLOUD&&S.view==='orders')setTimeout(()=>pullOrders().then(renderStore),4000)},

const SYN=[['generator','gen','genset','petrol','diesel','power','light'],['fridge','refrigerator','freezer','cooler'],['ac','aircon','airconditioner','air','conditioner','split','cooling'],['tv','television','smart','screen','led','display'],['phone','mobile','smartphone','handset','android','iphone','cellphone','tecno','infinix','samsung'],['laptop','notebook','computer','pc','macbook','hp','dell','lenovo'],['inverter','ups','battery','backup'],['solar','panel','sun'],['washer','washing','laundry','machine'],['microwave','oven','toaster','bake'],['fan','standing','ceiling','ventilator'],['blender','mixer','juicer','grinder'],['iron','pressing','steam'],['cooker','stove','gas','burner'],['headphone','earphone','earbud','airpod','headset'],['pump','borehole','water','pumping'],['drill','tool','grinder','welding','cutter'],['router','wifi','modem','network','mifi'],['camera','cctv','security','surveillance'],['speaker','sound','bluetooth','home theatre','soundbar']];
const ndiv=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const stem=w=>w.length>3?w.replace(/(es|s)$/,''):w;
function lev(a,b,m){if(Math.abs(a.length-b.length)>m)return m+1;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];let mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[b.length]}
function alts(t){const r=new Set([t,stem(t)]);SYN.forEach(g=>{if(g.includes(t)||g.includes(stem(t)))g.forEach(x=>r.add(x))});return [...r]}
function pDoc(p){const nm=ndiv(p.name),meta=ndiv([p.brand,cat(p.cat).name,p.tags,p.sku].join(' ')),body=ndiv((p.desc||'')+' '+(p.specs||''));return{nm,nmw:nm.split(' '),meta,mw:meta.split(' '),body}}
function pScore(p,toks){const d=pDoc(p);let tot=0;for(const t of toks){let best=0;const exact=[t,stem(t)],al=alts(t);
  for(const a of al){const w=exact.includes(a)?1:.6;
    if(d.nmw.some(x=>x===a||stem(x)===a))best=Math.max(best,10*w);else if(a.length>2&&d.nm.includes(a))best=Math.max(best,8*w);
    if(d.mw.some(x=>x===a||stem(x)===a))best=Math.max(best,6*w);else if(a.length>2&&d.meta.includes(a))best=Math.max(best,5*w);
    if(a.length>2&&d.body.includes(a))best=Math.max(best,3*w)}
  if(!best&&t.length>=4){const m=t.length>=7?2:1;if([...d.nmw,...d.mw].some(x=>x.length>=3&&lev(x,t,m)<=m))best=4}
  if(!best)return 0;tot+=best}return tot}
function searchRank(list,q){const toks=ndiv(q).split(' ').filter(Boolean);if(!toks.length)return list;
  let r=list.map(p=>[p,pScore(p,toks)]).filter(x=>x[1]>0);
  if(!r.length&&toks.length>1)r=list.map(p=>[p,toks.reduce((t,k)=>t+pScore(p,[k]),0)]).filter(x=>x[1]>0);
  return r.sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function didYouMean(q){const toks=ndiv(q).split(' ').filter(x=>x.length>=3);if(!toks.length)return '';const voc=new Set();DB.products.filter(p=>p.active).forEach(p=>{const d=pDoc(p);[...d.nmw,...d.mw].forEach(w=>w.length>=4&&voc.add(w))});
  let best='',bd=9;for(const w of voc)for(const t of toks){const d=lev(w,t,2);if(d<bd){bd=d;best=w}}return bd<=2?best:''}
const RK='electro_recent';
function recent(){try{return JSON.parse(localStorage.getItem(RK)||'[]')}catch(e){return[]}}

function recs(){const act=DB.products.filter(p=>p.active),seeds=[...recent(),...DB.wish,...DB.cart.map(x=>x.id)].map(id=>DB.products.find(p=>p.id===id)).filter(Boolean);if(!seeds.length)return[];
  const sc=new Map(seeds.map((p,i)=>[p,1/(1+i/3)])),cs={},bs={};seeds.forEach((p,i)=>{const w=1/(1+i/3);cs[p.cat]=(cs[p.cat]||0)+w;bs[p.brand]=(bs[p.brand]||0)+w});
  const seen=new Set(seeds.map(p=>p.id));
  return act.filter(p=>!seen.has(p.id)&&p.stock>0).map(p=>[p,(cs[p.cat]||0)*3+(bs[p.brand]||0)*1.5+Math.min((p.sold||0),50)/50]).filter(x=>x[1]>=1.5).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0])}

}

function placeOrder(f){
  const ls=cartLines();if(!ls.length)return;
  for(const {l,p} of ls)if(l.qty>p.stock)return toast(p.name+': only '+p.stock+' left');
  const sub=cartSub(),cd=couponDiscount(COUPON,sub),sh=shipFee(f.state.value),vat=(sub-cd.d)*DB.settings.vat/100,total=sub-cd.d+sh+vat;
  const id=CLOUD?'ORD-'+Date.now().toString(36).toUpperCase():'ORD-'+(1000+DB.orders.length+1);
  const o={id,userId:DB.session.user,name:f.name.value,phone:f.phone.value,email:(DB.users.find(u=>u.id===DB.session.user)||{}).email||'',address:'',state:f.state.value,city:'',phone2:'',landmark:'',notes:'',detailsPending:true,

  ls.forEach(({l,p})=>{p.stock-=l.qty;p.sold=(p.sold||0)+l.qty});

function setOrderStatus(o,s){
  if(s==='Cancelled'&&o.status!=='Cancelled')o.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.id);if(p){p.stock+=i.qty;p.sold=Math.max(0,(p.sold||0)-i.qty)}});
  if(o.status==='Cancelled'&&s!=='Cancelled')o.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.id);if(p){p.stock=Math.max(0,p.stock-i.qty);p.sold=(p.sold||0)+i.qty}});
  o.status=s;if(s==='Delivered'&&o.payment==='cod')o.payStatus='Paid';
}

  qminus:()=>{const e=$('#pq');e.textContent=Math.max(1,Number(e.textContent)-1)},
  qplus:id=>{const e=$('#pq'),p=DB.products.find(x=>x.id===id);e.textContent=Math.min(p.stock,Number(e.textContent)+1)},
  wish:id=>{const i=DB.wish.indexOf(id);i<0?DB.wish.push(id):DB.wish.splice(i,1);save();updateBadges()},
  cart:openCart,
  cplus:id=>{const l=DB.cart.find(x=>x.id===id),p=DB.products.find(x=>x.id===id);if(l.qty<p.stock)l.qty++;else toast('Max stock reached');save();openCart();updateBadgesQuiet()},
  cminus:id=>{const l=DB.cart.find(x=>x.id===id);l.qty--;if(l.qty<=0)DB.cart=DB.cart.filter(x=>x.id!==id);save();openCart();updateBadgesQuiet()},
  cdel:id=>{DB.cart=DB.cart.filter(x=>x.id!==id);save();openCart();updateBadgesQuiet()},

  account:()=>{if(DB.session.user){const u=DB.users.find(x=>x.id===DB.session.user);modal(`<h3>Hi, ${esc(u.name)}</h3><p class="mut">${esc(u.email)}</p><div class="row" style="margin-top:12px"><button class="btn" data-a="myorders">My orders</button><button class="btn ghost" data-a="logout">Logout</button></div>`)}else authModal('login')},
  reg:()=>authModal('register'),log:()=>authModal('login'),

  tostore:()=>{location.hash='';},

  cloudseed:()=>{if(!confirm('Upload demo products, categories, banners, coupons and shipping zones to the cloud?'))return;const d=seed();['products','categories','coupons','banners','shipping','reviews'].forEach(k=>DB[k]=d[k]);save();refreshAdmin();toast('Demo catalogue uploaded')},
  pedit:id=>productForm(id),

  csvcus:()=>csv('customers.csv',[['Name','Email','Phone','Joined'],...DB.users.map(u=>[u.name,u.email,u.phone,u.created])]),
  backup:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='electro-backup.json';a.click()},
  clrdemo:()=>{if(confirm('Delete all orders and customers?')){DB.orders=[];DB.users=[];DB.reviews=[];DB.products.forEach(p=>p.sold=0);save();refreshAdmin()}},

  const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();
  if(k==='login'&&CLOUD)return au.signInWithEmailAndPassword(f.email.value,f.pass.value).then(()=>closeModal()).catch(x=>toast(authMsg(x)));
  if(k==='login'){const u=DB.users.find(x=>x.email.toLowerCase()===f.email.value.toLowerCase()&&x.pass===f.pass.value);
    if(!u)return toast('Wrong email or password');if(u.blocked)return toast('Account blocked. Contact support.');
    DB.session.user=u.id;save();closeModal();renderStore();toast('Welcome back, '+u.name.split(' ')[0])}
  if(k==='register'&&CLOUD)return au.createUserWithEmailAndPassword(f.email.value,f.pass.value).then(async c=>{const u={id:c.user.uid,name:f.name.value,email:f.email.value,phone:f.phone.value,created:new Date().toISOString(),blocked:false};await fs.doc('users/'+u.id).set(u);await onAuth(c.user);route();toast('Account created')}).catch(x=>toast(authMsg(x)));
  if(k==='register'){if(DB.users.some(x=>x.email.toLowerCase()===f.email.value.toLowerCase()))return toast('Email already registered');
    const u={id:'u'+uid(),name:f.name.value,email:f.email.value,phone:f.phone.value,pass:f.pass.value,created:new Date().toISOString(),blocked:false};
    DB.users.push(u);DB.session.user=u.id;save();closeModal();renderStore();toast('Account created')}
  if(k==='order')placeOrder(f);
  if(k==='review'){if(CLOUD&&!DB.session.user)return toast('Please login to leave a review');DB.reviews.push({id:'r'+uid(),pid:f.dataset.id,name:f.name.value,rating:Number(f.rating.value),text:f.text.value,date:new Date().toISOString(),approved:DB.settings.autoApprove});save();toast(DB.settings.autoApprove?'Review posted':'Review submitted for approval');viewProduct(f.dataset.id)}
  if(k==='details'){const o=DB.orders.find(x=>x.id===f.dataset.id);if(!o)return;o.address=f.address.value;o.landmark=f.landmark.value;o.city=f.city.value;o.phone2=f.phone2.value;o.notes=f.notes.value;o.detailsPending=false;save();closeModal();updateBadges();modal(`<h3>✅ All set</h3><p>Order <b>${o.id}</b> is received. We will call <b>${esc(o.phone)}</b> about delivery.</p><div class="row end"><button class="btn" data-a="myorders">View my orders</button></div>`)}
  if(k==='quote'){const o=DB.orders.find(x=>x.id===f.dataset.id),fee=Number(f.fee.value)||0;o.shipping=fee;o.total=o.subtotal-o.discount+o.vat+fee;o.quotePending=false;save();refreshAdmin();orderModal(o.id);toast('Delivery price saved. Customer can now pay.')}
  if(k==='admlogin'&&CLOUD)return au.signInWithEmailAndPassword(f.email.value,f.pass.value).then(async c=>{await onAuth(c.user);if(!DB.session.admin){await au.signOut();toast('This account is not an admin')}else route()}).catch(x=>toast(authMsg(x)));
  if(k==='admlogin'){if(f.email.value===DB.settings.adminEmail&&f.pass.value===DB.settings.adminPass){DB.session.admin=true;save();renderAdmin()}else toast('Wrong admin credentials')}
  if(k==='product'){
    const id=f.dataset.id,d={name:f.name.value,cat:f.cat.value,brand:f.brand.value,price:Number(f.price.value),discount:Number(f.discount.value)||0,stock:Number(f.stock.value)||0,sku:f.sku.value,warranty:f.warranty.value,desc:f.desc.value,specs:f.specs.value,tags:f.tags.value,image:f.image.value,active:f.active.checked,flash:f.flash.checked,featured:f.featured.checked};
    if(id)Object.assign(DB.products.find(p=>p.id===id),d);else DB.products.push({id:'p'+uid(),created:new Date().toISOString(),sold:0,...d});
    save();closeModal();refreshAdmin();toast('Product saved');
  }
  if(k==='crud'){
    const col=f.dataset.col,id=f.dataset.id,c=CRUD[col],d={};
    c.fields.forEach(x=>{const el=f.elements[x.k];d[x.k]=x.t==='checkbox'?el.checked:x.t==='number'?Number(el.value)||0:el.value});
    if(id)Object.assign(DB[col].find(x=>x.id===id),d);else DB[col].push({id:col[0]+uid(),...c.def,...d});
    save();closeModal();refreshAdmin();toast('Saved');
  }
  if(k==='settings'){const s=DB.settings;['name','tagline','phone','whatsapp','email','address','bank',...(CLOUD?[]:['adminEmail','adminPass'])].forEach(x=>s[x]=f[x].value);
    s.vat=Number(f.vat.value)||0;s.lowStock=Number(f.lowStock.value)||0;['card','transfer','autoApprove'].forEach(x=>s[x]=f[x].checked);save();toast('Settings saved')}
});
window.addEventListener('hashchange',route);
setInterval(()=>{tick()},1000);
setInterval(()=>{if(location.hash!=='#admin'&&S.view==='home'&&!S.cat&&!S.q&&$('#hero')&&!$('#modal').innerHTML&&!$('#drawer').innerHTML){S.banner++;const y=window.scrollY;renderStore();window.scrollTo(0,y)}},6000);
/* Google Analytics 4: paste your Measurement ID (starts with G-) between the quotes */
const GA_ID='';
if(GA_ID){const g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(g);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',GA_ID)}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
boot();
</script>
