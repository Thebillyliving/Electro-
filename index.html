const ndiv=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const stem=w=>w.length>3?w.replace(/(es|s)$/,''):w;
function lev(a,b,m){if(Math.abs(a.length-b.length)>m)return m+1;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];let mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[b.length]}
function alts(t){const r=new Set([t,stem(t)]);SYN.forEach(g=>{if(g.includes(t)||g.includes(stem(t)))g.forEach(x=>r.add(x))});return [...r]}
function pDoc(p){const nm=ndiv(p.name),meta=ndiv([p.brand,cat(p.cat).name,p.tags,p.sku].join(' ')),body=ndiv((p.desc||'')+' '+(p.specs||''));return{nm,nmw:nm.split(' '),meta,mw:meta.split(' '),body}}
function pScore(p,toks){const d=pDoc(p);let tot=0;for(const t of toks){let best=0;const exact=[t,stem(t)],al=alts(t);
  for(const a of al){const w=exact.includes(a)?1:.6;
    if(d.nmw.some(x=>x===a||stem(x)===a))best=Math.max(best,10*w);else if(a.length>2&&d.nm.includes(a))best=Math.max(best,8*w);
    if(d.mw.some(x=>x===a||stem(x)===a))best=Math.max(best,6*w);else if(a.length>2&&d.meta.includes(a))best=Math.max(best,5*w);
    if(a.length>2&&d.body.includes(a))best=Math.max(best,3*w)}
  if(!best&&t.length>=4){const m=t.length>=7?2:1;if([...d.nmw,...d.mw].some(x=>x.length>=3&&lev(x,t,m)<=m))best=4}
  if(!best)return 0;tot+=best}return tot}
function searchRank(list,q){const toks=ndiv(q).split(' ').filter(Boolean);if(!toks.length)return list;
  let r=list.map(p=>[p,pScore(p,toks)]).filter(x=>x[1]>0);
  if(!r.length&&toks.length>1)r=list.map(p=>[p,toks.reduce((t,k)=>t+pScore(p,[k]),0)]).filter(x=>x[1]>0);
  return r.sort((a,b)=>b[1]-a[1]).map(x=>x[0])}

const r2=n=>Math.round((Number(n)||0)*100)/100;
const cbRate=()=>{const v=DB.settings.cbRate;return v==null||v===''?0.5:(Number(v)||0)};
const wallet=uid=>(DB.wallets&&DB.wallets[uid])||{balance:0,earned:0,spent:0,ledger:[]};
const cbHeld=uid=>DB.orders.filter(o=>o.userId===uid&&Number(o.cbUsed)>0&&!o.cbDebited&&o.status!=='Cancelled').reduce((a,o)=>a+Number(o.cbUsed),0);
const cbAvail=uid=>Math.max(0,Math.floor(Number(wallet(uid).balance||0)-cbHeld(uid)));
function cbCalc(ls,cap){
  const uid=DB.session.user,el=ls.filter(({p})=>p.cbPay),avail=uid?cbAvail(uid):0;
  if(!el.length)return{cb:0,avail,elig:false};
  const best=el.reduce((a,x)=>fprice(x.p)>fprice(a.p)?x:a,el[0]);
  const cb=Math.max(0,Math.floor(Math.min(avail,fprice(best.p),cap==null?1e12:cap)));
  return{cb,avail,elig:true,item:best.p};
}
function cbEarnFor(items,used){
  let base=0;(items||[]).forEach(it=>{const p=DB.products.find(x=>x.id===it.id);if(p&&p.cbEarn)base+=Math.min(Number(it.price)||0,fprice(p))*(Number(it.qty)||0)});
  return r2(Math.max(0,base-(Number(used)||0))*cbRate()/100);
}
function cbNow(cap){const ue=document.querySelector('form[data-f=order] [name=usecb]');return ue&&ue.checked?cbCalc(cartLines(),cap).cb:0}
function cbBox(){
  const ls=cartLines(),c=cbCalc(ls,null);if(!c.avail)return '';
  return c.elig&&c.cb>0?`<label class="chk" style="margin-top:10px"><input type="checkbox" name="usecb" data-i="chcb">🎁 Use cashback: take ${fmt(c.cb)} off ${esc(c.item.name)} <span class="mut">(balance ${fmt(c.avail)}, one item per order)</span></label>`:`<div class="mut" style="margin-top:10px">🎁 Cashback balance ${fmt(c.avail)}. Not usable on the items in your cart.</div>`;
}
async function walletAdj(uid,delta,type,orderId,note){
  let w;
  if(CLOUD){const d=await fs.doc('wallets/'+uid).get();w=d.exists?d.data():{balance:0,earned:0,spent:0,ledger:[]}}else w={...wallet(uid)};
  w.ledger=w.ledger||[];
  if(orderId&&type!=='adjust'&&w.ledger.some(x=>x.order===orderId&&x.type===type))return false;
  w.balance=Math.max(0,r2((w.balance||0)+delta));
  if(['earn','late','reverse','latereverse'].includes(type))w.earned=Math.max(0,r2((w.earned||0)+delta));
  if(type==='spend'||type==='refund')w.spent=Math.max(0,r2((w.spent||0)-delta));
  w.earned=w.earned||0;w.spent=w.spent||0;
  w.ledger=[{t:Date.now(),type,amt:r2(delta),order:orderId||'',note:note||''},...w.ledger].slice(0,60);
  if(CLOUD)await track(fs.doc('wallets/'+uid).set(w));
  DB.wallets[uid]=w;if(!CLOUD)save();return true;
}
async function cbDebit(o){
  if(!(Number(o.cbUsed)>0)||o.cbDebited||!['Paid','Partial'].includes(o.payStatus))return;
  await walletAdj(o.userId,-Number(o.cbUsed),'spend',o.id,'Used on order '+o.id);
  o.cbDebited=true;
  if(CLOUD){SNAP.orders=SNAP.orders||{};SNAP.orders[o.id]=JSON.stringify(o);await track(fs.collection('orders').doc(o.id).update({cbDebited:true}))}
}
async function cbCredit(o){
  if(o.status!=='Delivered'||o.payStatus!=='Paid'||o.cbCredited)return;
  const amt=cbEarnFor(o.items,o.cbUsed);

function setOrderStatus(o,s){

  if(o.status==='Cancelled'&&s!=='Cancelled')o.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.id);if(p){p.stock=Math.max(0,p.stock-i.qty);p.sold=(p.sold||0)+i.qty}});
  if(s!==o.status)trkAuto(o,s);

  let r=await get('/sitemap.xml');const okS=r.ok&&r.t.includes('<urlset');

  r=await get('/robots.txt');add(r.ok&&/sitemap:/i.test(r.t),'robots.txt',r.ok?'':fixHint);
  const prods=mode==='all'?act:act.slice(0,1);
  if(!act.length)add(false,'Product page','Add a product first.');
  let bad=0;const q=[...prods];
  const worker=async()=>{while(q.length){const p=q.shift(),x=await get('/p/'+p.id+'/'+slug(p.name)),m=x.ok?meta(x.t):null;
    if(!(x.ok&&m.ld&&m.title)){bad++;if(mode!=='all')add(false,'Product page: '+esc(p.name),x.status===404?'Not found. Is the product saved to the cloud?':fixHint)}
    else if(mode!=='all')add(true,'Product page: '+esc(p.name),'Google title: '+esc(m.title)+'<br>Description: '+esc(m.desc))}};
  await Promise.all([worker(),worker(),worker()]);
  if(mode==='all'&&act.length)add(bad===0,'All product pages',bad===0?act.length+' of '+act.length+' pages work':bad+' of '+act.length+' pages failed. They may not be saved to the cloud yet.');
  const c1=DB.categories.find(c=>act.some(p=>p.cat===c.id));
  if(c1){const x=await get('/c/'+c1.id+'/'+slug(c1.name));add(x.ok&&x.t.includes('<h1>'),'Category page: '+esc(c1.name),x.ok?'':fixHint)}
  r=await get('/city/lagos');add(r.ok&&r.t.includes('<h1>'),'City pages',r.ok?'':fixHint);
  r=await get('/info/privacy');add(r.ok&&r.t.includes('<h1>'),'Policy pages',r.ok?'':fixHint);
  if(DB.settings.gscFile){r=await get('/'+DB.settings.gscFile);add(r.ok&&r.t.includes('google-site-verification'),'Search Console file',r.ok?'Ready. Go to Search Console and tap Verify.':'Not found yet. Tap Save under Google settings, wait a minute, check again.')}
  out.innerHTML=R.join('')+'<p class="mut" style="margin-top:8px">Next: open Google Search Console, choose Sitemaps, type <b>sitemap.xml</b> and tap Submit.</p>';
}

  if(k==='cbrate'){DB.settings.cbRate=Math.max(0,Math.min(20,Number(f.cbRate.value)||0));save();refreshAdmin();return toast('Cashback rate saved')}
  if(k==='trkmeta'){const v={courier:f.courier.value.trim(),trackNo:f.trackNo.value.trim(),eta:f.eta.value};return admTrk(f.dataset.id,o=>Object.assign(o,v)).then(()=>toast('Saved'))}
  if(k==='trkpost'){const st=f.stage.value,v={t:Date.now(),s:st,loc:f.loc.value.trim(),note:f.note.value.trim()};return admTrk(f.dataset.id,o=>{o.track=o.track||[];o.track.push(v);if(['Dispatched','In transit','Arrived at local hub','Out for delivery','Delivery attempted'].includes(st)&&STATUSES.indexOf(o.status)<2)o.status='Shipped';if(st==='Delivered'){o.status='Delivered';o.deliveredAt=o.deliveredAt||new Date().toISOString()}}).then(()=>toast('Posted. Tap 📲 Notify to alert the customer'))}
  if(k==='quote'){const o=DB.orders.find(x=>x.id===f.dataset.id),fee=Number(f.fee.value)||0;o.shipping=fee;o.shipAdj=true;o.total=o.subtotal-o.discount+o.vat+fee;o.quotePending=false;save();refreshAdmin();orderModal(o.id);toast('Delivery price saved. Customer can now pay.')}
  if(k==='admlogin'&&CLOUD)return au.signInWithEmailAndPassword(f.email.value,f.pass.value).then(async c=>{await onAuth(c.user);if(!DB.session.admin){await au.signOut();toast('This account is not an admin')}else route()}).catch(x=>toast(authMsg(x)));
  if(k==='admlogin'){if(f.email.value===DB.settings.adminEmail&&f.pass.value===DB.settings.adminPass){DB.session.admin=true;save();renderAdmin()}else toast('Wrong admin credentials')}
  if(k==='product'){
    if(f.dataset.busy)return toast('Image still loading. Wait a moment, then tap Save.');
    const id=f.dataset.id,d={name:f.name.value,cat:f.cat.value,brand:f.brand.value,price:Number(f.price.value),discount:Number(f.discount.value)||0,stock:Number(f.stock.value)||0,sku:f.sku.value,warranty:f.warranty.value,desc:f.desc.value,specs:f.specs.value,instOn:f.instOn.checked,delHrs:Number(f.delHrs.value)||0,cbEarn:f.cbEarn.checked,cbPay:f.cbPay.checked,instDeposit:Math.min(90,Math.max(1,Number(f.instDeposit.value)||50)),instMonths:Math.min(24,Math.max(1,Math.round(Number(f.instMonths.value)||3))),tags:f.tags.value,seoTitle:f.seoTitle.value.trim(),seoDesc:f.seoDesc.value.trim(),image:f.image.value,active:f.active.checked,flash:f.flash.checked,featured:f.featured.checked};
    if(id)Object.assign(DB.products.find(p=>p.id===id),d);else DB.products.push({id:'p'+uid(),created:new Date().toISOString(),sold:0,...d});
    save();closeModal();refreshAdmin();toast('Product saved');
  }
  if(k==='crud'){
    const col=f.dataset.col,id=f.dataset.id,c=CRUD[col],d={};
    c.fields.forEach(x=>{const el=f.elements[x.k];d[x.k]=x.t==='checkbox'?el.checked:x.t==='number'?Number(el.value)||0:el.value});
    if(id)Object.assign(DB[col].find(x=>x.id===id),d);else DB[col].push({id:col[0]+uid(),...c.def,...d});
    save();closeModal();refreshAdmin();toast('Saved');
  }
  if(k==='seoset'){const s=DB.settings;let ga=f.gaId.value.trim().toUpperCase(),gf=f.gscFile.value.trim();
    if(ga&&!/^G-[A-Z0-9]{4,}$/.test(ga))return toast('Analytics ID looks like G-ABC123XYZ');
    if(gf){const m=gf.match(/google[a-z0-9]+\.html/i);if(!m)return toast('Paste the file name Google gave you, like google1234abcd.html');gf=m[0].toLowerCase()}
    s.gaId=ga;s.gscFile=gf;s.seoTitle=f.seoTitle.value.trim();s.seoDesc=f.seoDesc.value.trim();save();applySeo();refreshAdmin();toast('Google settings saved')}
  if(k==='settings'){const s=DB.settings;['name','tagline','phone','whatsapp','email','address','bank',...(CLOUD?[]:['adminEmail','adminPass'])].forEach(x=>s[x]=f[x].value);
    s.pickupAddr=f.pickupAddr.value.trim()||pickAddr();s.delHrs=Number(f.delHrs.value)||72;s.lateCb=f.lateCb.value===''?500:Math.max(0,Number(f.lateCb.value)||0);s.vat=Number(f.vat.value)||0;s.lowStock=Number(f.lowStock.value)||0;['card','transfer','autoApprove'].forEach(x=>s[x]=f[x].checked);save();toast('Settings saved')}
});
window.addEventListener('hashchange',route);
setInterval(()=>{tick()},1000);
setInterval(()=>{if(location.hash!=='#admin'&&S.view==='home'&&!S.cat&&!S.q&&$('#hero')&&!$('#modal').innerHTML&&!$('#drawer').innerHTML){S.banner++;const y=window.scrollY;renderStore();window.scrollTo(0,y)}},6000);
/* Google Analytics 4: set from Admin > SEO & Pages. GA_ID is only a fallback. */
const GA_ID='';
let GA_ON='';
function initGA(){const id=String((DB.settings&&DB.settings.gaId)||GA_ID||'').trim();if(!id||GA_ON===id||!/^G-[A-Z0-9]{4,}$/i.test(id)||(DB.session&&DB.session.admin))return;GA_ON=id;const g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id='+id;document.head.appendChild(g);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',id)}
function applySeo(){const s=DB.settings||{};if(s.seoTitle)document.title=s.seoTitle;const m=document.querySelector('meta[name=description]');if(m&&s.seoDesc)m.setAttribute('content',s.seoDesc)}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
boot();
</script>
